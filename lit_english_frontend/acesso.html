<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Como deseja acessar? — LIT English</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page">

  <div class="access-wrapper">

    <div class="logo">
      <svg class="logo-mark" viewBox="0 0 100 70" xmlns="http://www.w3.org/2000/svg">
        <rect x="6" y="6" width="88" height="50" rx="12" fill="none" stroke="#861E19" stroke-width="4"/>
        <text x="50" y="42" text-anchor="middle" font-family="Poppins, sans-serif" font-weight="800" font-size="30" fill="#861E19">CC</text>
        <line x1="14" y1="50" x2="86" y2="12" stroke="#861E19" stroke-width="4" stroke-linecap="round"/>
      </svg>
      <div class="logo-word">LIT ENGLISH</div>
      <div class="logo-rule"></div>
      <div class="logo-tagline">— Don't Get Lost In Translation —</div>
    </div>

    <div class="access-heading">
      <h1>Como deseja acessar?</h1>
      <p class="muted">Escolha o tipo de acesso para continuar.</p>
    </div>

    <div class="choice-grid">

      <!-- ALUNO -->
      <div class="choice-card">
        <div class="choice-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"></circle>
            <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"></path>
          </svg>
        </div>
        <h2>Entrar como aluno</h2>
        <p>Acesse sua conta pessoal e continue seus estudos.</p>
        <a href="login.html" class="btn btn-primary">Acessar</a>
      </div>

      <!-- ACESSO ESPECIAL -->
      <div class="choice-card">
        <div class="choice-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2.5 15 9.2 22 10.1 17 15 18.2 22 12 18.6 5.8 22 7 15 2 10.1 9 9.2 12 2.5"></polygon>
          </svg>
        </div>
        <h2>Acesso Especial</h2>
        <p>Acesso exclusivo para convidados e promoções especiais.</p>
        <a href="login.html?acesso=especial" class="btn btn-primary">Acessar</a>
      </div>

    </div>

    <a href="index.html" class="auth-back-link">&larr; Voltar para o site</a>

  </div>

</body>
</html>
