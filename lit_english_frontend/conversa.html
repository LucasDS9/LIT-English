<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Conversa com IA Tutor — LIT English</title>
  <link rel="stylesheet" href="css/style.css?v=20260813-3" />
  <link rel="stylesheet" href="css/conversation.css" />
</head>
<body>

  <div class="app-shell">

    <aside class="sidebar">
      <div class="logo">
        <svg class="logo-mark" viewBox="0 0 100 70" xmlns="http://www.w3.org/2000/svg">
          <rect x="6" y="6" width="88" height="50" rx="14" fill="none" stroke="#861E19" stroke-width="5"/>
          <text x="50" y="43" text-anchor="middle" font-family="Poppins, sans-serif" font-weight="800" font-size="28" fill="#861E19">LIT</text>
          <line x1="14" y1="50" x2="86" y2="12" stroke="#861E19" stroke-width="4" stroke-linecap="round"/>
        </svg>
      </div>

      <div class="aluno-badge">
        <span class="label" id="role-label">ALUNO</span>
        <span class="name" id="student-name">—</span>
      </div>

      <nav class="nav">
        <a href="home.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9.5h12V10"/><path d="M10 19.5v-5h4v5"/></svg>
          <span>Home</span>
        </a>
        <a href="aprender.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="m15.5 8.5 2-2"/></svg>
          <span>Learn</span>
        </a>
        <a href="revisar.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v16"/><path d="M9 4v16"/><path d="M14 4l5 16"/></svg>
          <span>Flashcards</span>
        </a>
        <a href="exercicios.html" id="nav-exercicios" class="nav-item" style="visibility:hidden">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="2.5"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>
          <span>Exercises</span>
        </a>
        <a href="textos.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7c-1.5-1.3-4-2-7-2v13c3 0 5.5.7 7 2 1.5-1.3 4-2 7-2V5c-3 0-5.5.7-7 2Z"/><path d="M12 7v13"/></svg>
          <span>Immersion</span>
        </a>
        <a href="conversa.html" class="nav-item active" id="nav-conversa">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3Z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
          <span>Conversa IA</span>
        </a>

        <div class="nav-spacer"></div>

        <button class="nav-item" id="logout-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19.5H6a2 2 0 0 1-2-2v-11a2 2 0 0 1 2-2h3"/><path d="M16 16.5l4.5-4.5-4.5-4.5"/><path d="M20.5 12H10"/></svg>
          <span>Sair</span>
        </button>
      </nav>
      <script>
        // Aplica a visibilidade de "Exercises" já no primeiro paint, usando o
        // usuário salvo em cache (localStorage), sem esperar a resposta da
        // API — evita o item "pulando" no menu (pop) depois que a página já
        // carregou. applyAccessRestrictions() roda de novo depois, com o
        // dado fresco do servidor, e confirma/corrige se preciso.
        (function () {
          try {
            var raw = localStorage.getItem("lit_user");
            var user = raw ? JSON.parse(raw) : null;
            var canUseExercises = !!(
              user &&
              user.role === "aluno" &&
              user.access_type === "padrao" &&
              user.is_approved === true
            );
            var el = document.getElementById("nav-exercicios");
            if (el) el.style.visibility = canUseExercises ? "visible" : "hidden";
          } catch (e) {}
        })();
      </script>
    </aside>

    <main class="main main--conversa">

      <header class="conv-header">
        <h1>Conversa <span class="conv-dot">•</span> IA Tutor</h1>
        <p class="conv-subtitle">Pratique inglês falado com o tutor de IA e receba correções em tempo real.</p>
      </header>

      <div id="conv-locked" class="conv-locked hidden"></div>

      <div id="conv-workspace" class="conv-workspace hidden">

        <!-- ---------- COLUNA DO CHAT ---------- -->
        <section class="conv-chat-column">
          <div id="chat-scroll" class="chat-scroll"></div>

          <div class="mic-bar">
            <button id="mic-btn" class="mic-btn" title="Falar" disabled>
              <svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3Z" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </button>
            <span id="mic-status" class="mic-status">Conectando…</span>
          </div>
        </section>

        <!-- ---------- PAINEL SPEECH ANALYSIS ---------- -->
        <aside id="analysis-panel" class="analysis-panel hidden">
          <div class="analysis-header">
            <h2>Speech Analysis</h2>
            <button id="analysis-collapse-btn" class="chevron-btn" title="Recolher">
              <svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <div id="analysis-body" class="analysis-body"></div>
        </aside>

      </div>
    </main>

  </div>

  <div class="toast" id="toast" hidden></div>

  <!-- templates -->
  <template id="tpl-tutor-bubble">
    <div class="bubble tutor-bubble">
      <p class="bubble-text"></p>
      <p class="bubble-translation hidden"></p>
      <div class="bubble-actions">
        <button class="action-btn listen-btn">
          <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4Z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          Ouvir
        </button>
        <button class="action-btn translate-btn">
          <svg viewBox="0 0 24 24"><path d="M3 5h9M7 3v2m0 0c0 4-2 7-5 8m5-8c1 2 2.5 3.4 4 4.3M14 21l4-9 4 9M15.6 18h4.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Traduzir
        </button>
      </div>
    </div>
  </template>

  <template id="tpl-student-bubble">
    <div class="bubble student-bubble">
      <p class="bubble-text"></p>
    </div>
  </template>

  <template id="tpl-analysis-summary">
    <div class="analysis-summary">
      <div class="analysis-summary-row">
        <span class="analysis-summary-title">Speech Analysis <span class="chev">⌃</span></span>
        <button class="ver-analise-btn">Ver análise <span class="chev-down">⌄</span></button>
      </div>
    </div>
  </template>

  <script src="js/api.js"></script>
  <script src="js/conversation.js"></script>
</body>
</html>
